# Vyda hru pro Windows, macOS a Linux.
#
# Spusti se pushnutim tagu v*, napr.:  git tag v1.1 && git push origin v1.1
# (nebo rucne v zalozce Actions). Kazdy system zabali jpackage NA SVEM
# systemu (jinak to nejde) a vysledky jdou do GitHub Release k tagu.
# Launcher si nove verze bere prave odtud.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
          - os: ubuntu-latest
            name: linux
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Fat jar
        run: mvn -B -q package

      - name: Testy
        continue-on-error: true
        shell: bash
        run: |
          CP=$(mvn -B -q dependency:build-classpath -Dmdep.outputFile=/dev/stdout)
          SEP=':'; [ "$RUNNER_OS" = "Windows" ] && SEP=';'
          java -Djava.awt.headless=true -cp "target/classes${SEP}target/test-classes${SEP}${CP}" mc.AllTests || echo "::warning::Nektere testy selhaly (vykonove testy na sdilenem stroji kolisaji)"

      - name: jpackage
        shell: bash
        run: |
          JAR=$(ls target/minecraft-base-*.jar | grep -v original | head -n 1)
          VERSION=$(basename "$JAR" .jar | grep -oE '[0-9]+(\.[0-9]+)*' | head -n 1)
          mkdir -p target/jpackage-input dist
          cp "$JAR" target/jpackage-input/
          EXTRA=""
          # macOS: GLFW chce hlavni vlakno.
          [ "$RUNNER_OS" = "macOS" ] && EXTRA="--java-options -XstartOnFirstThread"
          jpackage --type app-image --name MinecraftClaude --app-version "$VERSION" \
            --input target/jpackage-input --main-jar "$(basename "$JAR")" --main-class mc.Launch \
            --add-modules java.base,java.desktop,java.logging,jdk.unsupported \
            --java-options -Djava.awt.headless=true \
            --java-options --enable-native-access=ALL-UNNAMED \
            $EXTRA --dest dist
          # Launcher: totez jadro, vstup LauncherMain; hru si stahne odtud z Releases.
          jpackage --type app-image --name MinecraftClaudeLauncher --app-version "$VERSION" \
            --input target/jpackage-input --main-jar "$(basename "$JAR")" --main-class mc.LauncherMain \
            --add-modules java.base,java.desktop,java.logging,java.net.http,jdk.unsupported \
            --dest dist
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip "MinecraftClaude-${{ matrix.name }}.zip" MinecraftClaude > /dev/null
            7z a -tzip "MinecraftClaudeLauncher-${{ matrix.name }}.zip" MinecraftClaudeLauncher > /dev/null
          elif [ "$RUNNER_OS" = "macOS" ]; then
            ditto -c -k --keepParent MinecraftClaude.app "MinecraftClaude-${{ matrix.name }}.zip"
            ditto -c -k --keepParent MinecraftClaudeLauncher.app "MinecraftClaudeLauncher-${{ matrix.name }}.zip"
          else
            tar czf "MinecraftClaude-${{ matrix.name }}.tar.gz" MinecraftClaude
            tar czf "MinecraftClaudeLauncher-${{ matrix.name }}.tar.gz" MinecraftClaudeLauncher
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: MinecraftClaude-${{ matrix.name }}
          path: |
            dist/MinecraftClaude-${{ matrix.name }}.*
            dist/MinecraftClaudeLauncher-${{ matrix.name }}.*

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
